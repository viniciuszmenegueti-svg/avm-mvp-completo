services:
  postgres:
    image: postgres:16.4
    container_name: avm-postgres
    environment:
      POSTGRES_DB: avm
      POSTGRES_USER: avm_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - avm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U avm_app -d avm"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: avm-api:local
    container_name: avm-api
    environment:
      DATABASE_URL: postgresql+psycopg://avm_app:${POSTGRES_PASSWORD}@postgres:5432/avm
      APP_NAME: ${APP_NAME:-AVM Imoveis API}
      APP_VERSION: ${APP_VERSION:-0.2.0-dev}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  avm-postgres-data: