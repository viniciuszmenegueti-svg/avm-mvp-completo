services:
  postgres:
    image: postgres:16.4
    container_name: avm-postgres
    environment:
      POSTGRES_DB: avm
      POSTGRES_USER: avm_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - avm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U avm_app -d avm"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: avm-api:local
    container_name: avm-api
    environment:
      DATABASE_URL: postgresql+psycopg://avm_app:${POSTGRES_PASSWORD}@postgres:5432/avm
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  avm-postgres-data:
