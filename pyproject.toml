[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-q",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]