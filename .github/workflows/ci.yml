name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes automatizados
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      POSTGRES_PASSWORD: ci_password
      APP_NAME: AVM Imoveis API
      APP_VERSION: 0.2.0
      APP_ENV: test
      APP_DEBUG: "false"
      LOG_LEVEL: INFO

      # Permitido exclusivamente no ambiente automatizado de testes.
      # Em produção, deve permanecer false.
      ALLOW_SYNTHETIC_PRICING: "true"

      ADMIN_CREDENTIALS_JSON: '{"ci-admin":"ci_admin_key"}'

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Auditar dependencias de producao
        run: pip-audit -r requirements.txt

      - name: Verificar qualidade do codigo
        run: ruff check .

      - name: Verificar formatacao do codigo
        run: ruff format --check .

      - name: Verificar tipos com MyPy
        run: python -m mypy

      - name: Executar testes com cobertura
        run: python -m pytest

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Construir imagem Docker
        run: docker build -t avm-api:ci .

      - name: Iniciar ambiente Docker
        run: docker compose up -d --build

      - name: Aguardar API ficar saudavel
        run: |
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' avm-api 2>/dev/null || true)"

            if [ "$status" = "healthy" ]; then
              echo "API saudavel."
              exit 0
            fi

            echo "Tentativa $attempt/30: status atual = ${status:-indisponivel}"
            sleep 2
          done

          echo "A API nao ficou saudavel dentro do prazo."
          docker compose ps
          docker compose logs api
          exit 1

      - name: Verificar migrations pendentes
        run: docker compose exec -T api alembic check

      - name: Executar teste de integracao
        run: python scripts/integration-test.py

      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Encerrar ambiente Docker
        if: always()
        run: docker compose down -v