name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tests:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Auditar dependencias de producao
        run: pip-audit -r requirements.txt

      - name: Verificar qualidade do codigo
        run: ruff check .

      - name: Verificar formatacao do codigo
        run: ruff format --check .

      - name: Verificar tipos com MyPy
        run: python -m mypy

      - name: Executar testes com cobertura
        run: python -m pytest

      - name: Validar Docker Compose
        env:
          POSTGRES_PASSWORD: ci_password
        run: docker compose config --quiet

      - name: Construir imagem Docker
        run: docker build -t avm-api:ci .

      - name: Iniciar ambiente Docker
        env:
          POSTGRES_PASSWORD: ci_password
        run: docker compose up -d --build

      - name: Aguardar API ficar pronta
        run: |
          for tentativa in {1..30}; do
            if curl --fail --silent \
              http://localhost:8000/health/ready; then
              echo
              echo "API pronta."
              exit 0
            fi

            echo "Aguardando API... tentativa ${tentativa}/30"
            sleep 2
          done

          echo "A API nao ficou pronta dentro do prazo."
          docker compose ps
          docker compose logs
          exit 1

      - name: Testar endpoints principais
        run: |
          curl --fail --silent \
            http://localhost:8000/health/live

          curl --fail --silent \
            http://localhost:8000/health/ready

          curl --fail --silent \
            http://localhost:8000/cities

      - name: Criar ordem de teste
        run: |
          response=$(curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{
              "external_order_id": "CI-ORDER-000001",
              "property": {
                "property_type": "APARTMENT",
                "state": "SP",
                "city": "São Paulo",
                "city_ibge_code": "3550308",
                "postal_code": "01001-000",
                "neighborhood": "Centro",
                "street": "Rua de Teste",
                "number": "100",
                "complement": "Apartamento 10",
                "private_area_m2": 70,
                "built_area_m2": 80,
                "land_area_m2": null,
                "bedrooms": 2,
                "bathrooms": 2,
                "parking_spaces": 1
              }
            }' \
            http://localhost:8000/orders)

          echo "$response"

          internal_order_id=$(echo "$response" | python -c \
            "import json, sys; print(json.load(sys.stdin)['internal_order_id'])")

          echo "INTERNAL_ORDER_ID=$internal_order_id" >> "$GITHUB_ENV"

      - name: Consultar ordem criada
        run: |
          curl --fail --silent \
            http://localhost:8000/orders/external/CI-ORDER-000001

      - name: Atualizar status da ordem
        run: |
          response=$(curl --fail --silent \
            --request PATCH \
            --header "Content-Type: application/json" \
            --data '{
              "status": "VALIDATING_INPUT"
            }' \
            "http://localhost:8000/orders/${INTERNAL_ORDER_ID}/status")

          echo "$response"

          status=$(echo "$response" | python -c \
            "import json, sys; print(json.load(sys.stdin)['status'])")

          test "$status" = "VALIDATING_INPUT"

      - name: Consultar historico de status
        run: |
          response=$(curl --fail --silent \
            "http://localhost:8000/orders/${INTERNAL_ORDER_ID}/status-history")

          echo "$response"

          echo "$response" | python -c "
          import json
          import sys

          data = json.load(sys.stdin)

          assert len(data) >= 1
          assert data[-1]['previous_status'] == 'RECEIVED'
          assert data[-1]['new_status'] == 'VALIDATING_INPUT'
          "

      - name: Bloquear ordem duplicada
        run: |
          status_code=$(curl --silent \
            --output duplicate-response.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{
              "external_order_id": "CI-ORDER-000001",
              "property": {
                "property_type": "APARTMENT",
                "state": "SP",
                "city": "São Paulo",
                "city_ibge_code": "3550308",
                "postal_code": "01001-000",
                "neighborhood": "Centro",
                "street": "Rua de Teste",
                "number": "100",
                "complement": "Apartamento 10",
                "private_area_m2": 70,
                "built_area_m2": 80,
                "land_area_m2": null,
                "bedrooms": 2,
                "bathrooms": 2,
                "parking_spaces": 1
              }
            }' \
            http://localhost:8000/orders)

          cat duplicate-response.json
          echo
          echo "Status HTTP: $status_code"

          test "$status_code" = "409"

      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Encerrar ambiente Docker
        if: always()
        run: docker compose down -v